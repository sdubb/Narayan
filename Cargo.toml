[package]
name = "narayan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "narayan"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1.50", features = ["full"] }
tokio-util   = { version = "0.7.13", features = ["rt"] }
anyhow       = "1.0.97"
serde        = { version = "1.0.218", features = ["derive"] }
serde_json   = "1.0.139"
chrono       = { version = "0.4.39", features = ["serde"] }
uuid         = { version = "1.15.1", features = ["v4", "serde"] }
axum         = { version = "0.8.8", features = ["macros"] }
tower        = "0.5.2"
tower-http   = { version = "0.6.8", features = ["cors", "trace"] }
tower_governor = { version = "0.6.0", features = ["axum"] }
async-trait  = "0.1.87"
tracing      = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
sqlx         = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "chrono", "uuid"] }
# This repo now uses the sqlx 0.8 stable line.
# pgvector crate remains removed even though the dependency line is now compatible again.
# Vector values are passed as text with ::vector casts instead of introducing a pgvector crate dependency.
redis        = { version = "1.0.5", features = ["tokio-comp"] }
reqwest      = { version = "0.12.12", features = ["json", "stream"] }
tokio-stream = "0.1.17"
futures      = "0.3.31"
dotenv       = "0.15.0"
config       = "0.15.8"
sha2         = "0.10.8"
hex          = "0.4.3"
dashmap      = "6.1.0"
# Tool dependencies
walkdir      = "2.5"
glob         = "0.3.2"
regex        = "1.11"
scraper      = "0.22"
base64       = "0.22.1"
mime_guess   = "2.0"
libc         = "0.2.170"
thiserror    = "2.0.12"
futures-util = "0.3.31"


# WASM runtime — WASI 0.2 stable (Feb 2026)
wat           = "1"
wasmtime      = { version = "31", features = ["async", "cranelift", "component-model"] }
wasmtime-wasi = "31"

# Headless browser — full CDP over Tokio
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }

# Browser pool + sync


# Tool dependencies (batch add)
similar          = "2.7.0"         # diff + patch
zip              = "2.2.2"         # compress/decompress
flate2           = "1.0.35"        # gzip
tar              = "0.4.43"        # tarballs
image            = { version = "0.25.5", default-features = false, features = ["png","jpeg","gif","webp","bmp","tiff"] }
russh            = "0.58.0"        # ssh_exec
russh-sftp       = "2.1.1"         # sftp (companion to russh)
bollard          = { version = "0.20.2", features = ["ssl"] }  # docker
calamine         = "0.26.1"        # spreadsheet read
rust_xlsxwriter  = "0.82.0"        # spreadsheet write
sysinfo          = "0.33.1"        # process monitor
kube             = { version = "3.1.0", features = ["client","runtime"] }  # kubernetes
k8s-openapi      = { version = "0.27.1", features = ["v1_31"] }
printpdf         = "0.7.0"         # pdf create
ring             = "0.17.11"       # crypto
hmac             = "0.12.1"
urlencoding      = "2.1.3"
croner           = "2.1.0"
chrono-tz        = "0.10.1"
zstd             = "0.13.2"        # tar.zst exports / compression

[dev-dependencies]
tokio-test = "0.4.3"
tempfile   = "3.17.1"
